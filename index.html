<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#f5f3e9" />
  <meta name="description" content="以互動城市探索新竹施政整理，收錄13類、117項資料，區分資料所列成果、已完成與推動中項目。" />
  <title>新竹風城島｜城市裡的每一件事</title>
</head>
<body>
  <a class="skip-link" href="#search">跳至成果清單</a>
  <div id="app">
    <section class="city" aria-label="新竹成果互動城市">
      <div id="stage"><p class="loading">正在準備城市風景…</p></div>
      <header class="brand"><a href="./" aria-label="新竹風城島首頁"><span class="brand-symbol" aria-hidden="true">竹<span>↗</span></span><span><strong>新竹風城島</strong><small>HSINCHU · CITY IN PROGRESS</small></span></a><span class="edition">互動資料版</span></header>
      <div class="intro"><div class="eyebrow">A CITY, MANY STORIES.</div><h1>城市裡的<br>每一件事。</h1><p>從日常出發，<br>走進新竹的城市風景。</p><div class="intro-count"><b>13</b> 個主題 <span>／</span> <b>117</b> 項紀錄</div></div>
      <nav class="map-actions" aria-label="地圖操作"><a id="play-game" href="./game/" title="另一個進入點：新竹地標城市小遊戲">▶ <span class="long">玩《午安新竹》</span><span class="short">遊戲</span></a><button id="reset" title="回到全景">↗ <span>全景</span></button><button id="weather" aria-label="切換示意天氣，目前晴時多雲" title="示意天氣，非即時預報">☁ 晴時多雲</button><button id="help" aria-label="操作說明">?</button><button id="open-index" aria-controls="sidebar" aria-expanded="false">☰ 清單</button></nav>
      <div class="scene-caption"><span class="live-dot"></span> 城市縮影 <span class="caption-divider">/</span> 點選一座島，開始探索<small>主題配置為視覺示意，非實際地理位置</small></div>
      <div class="scene-controls" aria-label="城市顯示設定"><button id="labels" aria-pressed="true"><span>▱</span>名牌</button><button id="topview" aria-pressed="false"><span>◇</span>鳥瞰</button><button id="pause" aria-pressed="false"><span>Ⅱ</span>暫停</button><span class="control-divider"></span><label for="daylight"><span>☼</span><span class="sr-only">日照示意時間</span><input id="daylight" type="range" min="6" max="22" step="1" value="12"><output id="time-label" for="daylight">12:00</output></label></div>
      <span class="scene-hint">拖曳旋轉 · 滾輪縮放 · 日照為示意</span>
    </section>
    <aside id="sidebar" aria-label="成果主題與項目清單">
      <div class="side-header"><div class="eyebrow">THE CITY INDEX <button id="close-index" aria-label="關閉清單">✕</button></div><h2>一起，走進新竹。</h2><p>高虹安任內施政成果整理<br><span>推動中項目進度：2026.10.23</span></p><div class="search-box"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="搜尋成果、關鍵字…" aria-label="搜尋成果、關鍵字"></div><div class="filters" role="group" aria-label="依項目狀態篩選"><button data-filter="all" aria-pressed="true">全部 <b>117</b></button><button data-filter="reported" aria-pressed="false">所列成果 <b>82</b></button><button data-filter="completed" aria-pressed="false">已完成 <b>27</b></button><button data-filter="pending" aria-pressed="false">推動中 <b>8</b></button></div></div>
      <div id="list-summary" class="list-summary" aria-live="polite"></div><div id="category-list"></div>
      <footer class="side-footer"><span>每一項紀錄，都有它的進度。</span><button id="sources">資料來源與閱讀說明 ↗</button></footer>
    </aside>
  </div>
  <dialog id="detail" aria-labelledby="detail-title"><button class="dialog-close" aria-label="關閉詳細資料">✕</button><div id="detail-content"></div></dialog>
  <dialog id="info" aria-labelledby="info-title"><button class="dialog-close" aria-label="關閉說明">✕</button><div id="info-content"></div></dialog>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
