<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="《午安新竹》：修一格、蓋一站，在倒數歸零前接住城市的每一張需求單。新竹地標主題的城市小遊戲。">
<title>午安新竹</title>
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@900&display=swap&text=%E4%B8%80%E4%BA%86%E4%BB%8A%E4%BD%8F%E5%80%BC%E5%81%9C%E5%9F%8E%E5%A4%A9%E5%AE%8C%E5%B7%B2%E5%BA%A7%E6%88%90%E6%8E%A5%E6%9A%AB%E7%8F%AD%E7%AC%AC%E7%B9%BC%E7%BA%8C%E8%8B%A6%E8%BE%9B%E9%80%99%EF%BC%81%E5%8D%88%E5%AE%89%E6%96%B0%E7%AB%B9">
<style>
:root{--bg:#0f1724;--panel:#172133;--panel2:#1f2b40;--line:#2c3a52;--text:#e8edf5;--muted:#93a1b8;--gold:#ffd166;--red:#ff5d5d;--eng:#f2b134;--rescue:#ef5b4c;--care:#3fbf7f;--transit:#4aa3f0;color-scheme:dark}
html{height:100%;box-sizing:border-box;background:#0f1724}
*,*::before,*::after{box-sizing:border-box}
body{height:100%;margin:0;background:#0f1724;color:#e8edf5;overflow:hidden;font-family:system-ui,-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;-webkit-tap-highlight-color:transparent;touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;-webkit-tap-highlight-color:transparent}
#app{position:relative;height:100%;width:100%;overflow:hidden;display:flex;justify-content:center;background:#0f1724}
#main{position:relative;height:100%;width:100%;max-width:480px;display:flex;flex-direction:column;padding:6px max(16px,env(safe-area-inset-right)) calc(env(safe-area-inset-bottom) + 8px) max(16px,env(safe-area-inset-left));overflow:hidden}
.side{display:none}
@media (min-width:900px){
  .side{display:flex;flex-direction:column;gap:10px;width:260px;padding:16px 12px;overflow:hidden;background:#121c2c;border-left:1px solid #22304a;border-right:1px solid #22304a}
  #main{max-width:500px}
}
.sideh{font-size:.85rem;color:#93a1b8;letter-spacing:.05em;margin-top:6px}
#fcBig .fcrow{display:flex;align-items:center;gap:8px;padding:8px 10px;background:#1f2b40;border-radius:10px;margin-bottom:6px;font-size:1rem}
#fcBig .fcrow .sec{margin-left:auto;font-variant-numeric:tabular-nums;color:#ffd166;font-weight:700}
#log{list-style:none;margin:0;padding:0;font-size:.85rem;color:#c7d1e0;display:flex;flex-direction:column;gap:4px;overflow:hidden}
#log li{padding:4px 8px;background:#172133;border-radius:6px}
#log li.bad{color:#9aa6b8}
#log li.good{color:#ffe29a}
.brk{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:.95rem}
.brk .v{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.lampbar{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.lampbar .lr{display:flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums}
/* HUD */
#hud{flex:none;display:flex;flex-direction:column;gap:2px}
.hrow{display:flex;align-items:center;gap:12px;min-height:38px;min-width:0}
#hTime .bsec{color:#ffd166;margin-left:6px}
.hi{display:flex;align-items:center;gap:4px;font-weight:800;font-size:min(1.15rem,21px);font-variant-numeric:tabular-nums;white-space:nowrap}
.hi svg{flex:none}
#hNext{font-size:clamp(14px,.875rem,16px);color:#93a1b8;font-weight:600;margin-left:2px}
.hrow.tight #hNext{display:none}
.hsp{flex:1}
.icon-btn{width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:12px;background:#172133;flex:none}
.h2{min-height:44px;gap:8px}
.icon-btn.gear{background:none}
#combo{display:flex;align-items:center;gap:6px;font-weight:800;font-size:min(1.1rem,20px);color:#ffd166;opacity:0;transition:opacity .2s}
#combo.on{opacity:1}
#combo .ring circle{transition:none}
#combo.blink{animation:blink .35s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}
#stageDots{display:flex;gap:6px;margin-left:auto;margin-right:4px}
#stageDots i{width:12px;height:12px;border-radius:50%;background:#2c3a52;display:block}
#stageDots i.on{background:#ffd166}
/* forecast */
#forecast{flex:none;display:flex;flex-wrap:wrap;gap:6px;min-height:2.7em;align-items:center;padding:2px 0 4px}
.chip{display:flex;align-items:center;gap:4px;padding:4px 10px;min-height:34px;background:#1f2b40;border:1px dashed #5d7090;border-radius:18px;font-weight:800;font-variant-numeric:tabular-nums;font-size:min(1rem,18px);white-space:nowrap}
.chip .sec{color:#ffd166;margin-left:2px}
.chip.big{border-color:#4aa3f0;background:#1a2d48}
.chip.boss{border:2px solid #ffb627;background:#3a2a12}
.chip .bbar{display:block;width:56px;height:8px;border-radius:4px;background:#0006;overflow:hidden;margin-left:4px}
.chip .bbar i{display:block;height:100%;background:#ffb627;transform-origin:left center}
.chip .prog{color:#e8edf5;margin-left:4px}
.chip .prog.ok{color:#7be0a5}
/* board */
#boardWrap{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;position:relative}
#board{position:relative;--cs:60px}
.cell{position:absolute;left:0;top:0;width:var(--cs);height:var(--cs);padding:2px}
.tile{position:absolute;inset:2px;border-radius:10px;overflow:hidden;background:#232b39}
.ly{position:absolute;inset:0;opacity:0;transition:opacity .6s var(--d,0s)}
.lb{opacity:1;background:#262e3c;background-image:linear-gradient(135deg,transparent 46%,#1b212c 47%,#1b212c 52%,transparent 53%),linear-gradient(45deg,transparent 60%,#1d2430 61%,#1d2430 64%,transparent 65%)}
.l0{background:#2a4258}.l1{background:#2c5560}.l2{background:#2f5f4a}.l3{background:#33416e}
.cell.dev .lb{opacity:0}
#board.s0 .cell.dev .l0,#board.s1 .cell.dev .l1,#board.s2 .cell.dev .l2,#board.s3 .cell.dev .l3{opacity:1}
.lit{position:absolute;inset:0;opacity:0;transition:opacity .5s var(--d,0s);background:radial-gradient(circle at 20% 22%,#ffd16699 0 3px,transparent 4px),radial-gradient(circle at 78% 28%,#ffd16699 0 3px,transparent 4px),radial-gradient(circle at 30% 80%,#ffd16677 0 3px,transparent 4px),radial-gradient(circle at 82% 82%,#ffd16677 0 3px,transparent 4px)}
#board.s3 .cell.dev .lit{opacity:1}
.pulse{position:absolute;inset:0;background:#ffffff;opacity:0;border-radius:10px}
.cell.pz .pulse{animation:pz .5s ease-out}
@keyframes pz{0%{opacity:.35}100%{opacity:0}}
.ct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.ct .hint{position:absolute;right:3px;top:3px}
.ct .stk{position:absolute;left:3px;top:3px;display:flex;gap:2px}
.ct .hst{position:absolute;left:2px;bottom:2px;display:flex;gap:2px;font-size:10px;font-weight:800;color:#e8edf5;align-items:center}
.ct .pct{position:absolute;bottom:3px;left:0;right:0;text-align:center;font-size:11px;font-weight:800;color:#ffd166;font-variant-numeric:tabular-nums}
.ct .lock{position:absolute;right:3px;bottom:3px}
.ct .halt{position:absolute;right:3px;bottom:3px;font-size:11px;font-weight:800;color:#93a1b8}
.cell.repairable .tile{box-shadow:inset 0 0 0 2px #5d7090}
.cell.tutp .tile{animation:tp 1s ease-in-out infinite}
@keyframes tp{50%{box-shadow:inset 0 0 0 3px #ffd166}}
.cell.site.active .tile{animation:tp .8s ease-in-out infinite}
.cell.empty .tile{box-shadow:inset 0 0 0 2px #3f6a86}
.cell.flash .tile{animation:fl .5s steps(2) 2}
@keyframes fl{50%{box-shadow:inset 0 0 0 3px #ff5d5d}}
.pr{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-90deg);pointer-events:none}
.layer{position:absolute;inset:0;pointer-events:none}
.fcring{position:absolute;left:0;top:0;border:2px dashed #b9c8de;border-radius:50%;opacity:.7;animation:fcr 1.2s ease-in-out infinite}
.fcring.big{border-color:#7cc4ff}
@keyframes fcr{50%{opacity:.25}}
.aura{position:absolute;left:0;top:0;border:2px dashed #ffd166;border-radius:12px;opacity:.8}
/* bubbles */
.bubble{position:absolute;left:0;top:0;width:56px;height:56px;margin:-28px 0 0 -28px;pointer-events:auto;cursor:pointer;z-index:2}
.bubble .bin{position:absolute;inset:6px;border-radius:50%;background:#f4f1e8;box-shadow:0 3px 0 #0006;display:flex;align-items:center;justify-content:center;gap:2px}
.bubble.big .bin{background:#dff0ff}
.bubble.boss .bin{background:#fff1d6;box-shadow:0 0 0 3px #ffb627,0 3px 0 #0006}
.bubble.positive .bin{background:#ffe9a8}
.bubble .ring{position:absolute;left:0;top:0;transform:rotate(-90deg);z-index:1;pointer-events:none}
.bubble .ic{display:flex;align-items:center;justify-content:center}
.bubble .ic.as{opacity:.3}
.bubble .part{z-index:2;position:absolute;bottom:-10px;left:50%;transform:translateX(-50%);background:#172133;color:#ffd166;border-radius:8px;padding:0 5px;font-size:13px;line-height:1.15;font-weight:800;white-space:nowrap}
.bubble.urgent .bin{animation:shk .25s linear infinite}
@keyframes shk{25%{transform:translateX(-1.5px)}75%{transform:translateX(1.5px)}}
.bubble.out-miss{pointer-events:none;animation:bmiss .8s ease-in forwards}
.bubble.out-miss .bin{background:#8c939e;filter:none}
@keyframes bmiss{to{opacity:0;transform:var(--p) translateY(-26px) scale(.8)}}
.bubble.out-catch{pointer-events:none;animation:bpop .35s ease-out forwards}
@keyframes bpop{to{opacity:0;transform:var(--p) scale(1.5)}}
.bubble.press .bin{animation:press .12s ease-out}
@keyframes press{50%{transform:scale(.86)}}
/* units */
.unit{position:absolute;left:0;top:0;width:22px;height:22px;margin:-11px 0 0 -11px;filter:drop-shadow(0 2px 0 #0008)}
/* fx */
.ft{position:absolute;left:0;top:0;white-space:nowrap;font-weight:900;font-size:1.05rem;color:#fff;text-shadow:0 2px 0 #000a,0 0 6px #000a;pointer-events:none;animation:ftu 1s ease-out forwards}
.ft.gold{color:#ffd166}
.ft.combo{color:#7cf2c0}
.ft.hold{color:#9ad8ff}
.ft.small{font-size:.85rem}
.ft.big{font-size:1.5rem}
@keyframes ftu{0%{opacity:0;transform:var(--p) translate(-50%,0) scale(.7)}15%{opacity:1;transform:var(--p) translate(-50%,-10px) scale(1.1)}100%{opacity:0;transform:var(--p) translate(-50%,-44px) scale(1)}}
.rip{position:absolute;left:0;top:0;width:40px;height:40px;margin:-20px 0 0 -20px;border:3px solid #ffd166;border-radius:50%;animation:rip .7s ease-out forwards}
@keyframes rip{0%{opacity:.9;transform:var(--p) scale(.3)}100%{opacity:0;transform:var(--p) scale(4)}}
.fx-glow{position:absolute;left:0;top:0;width:60px;height:60px;margin:-30px 0 0 -30px;border-radius:50%;background:radial-gradient(circle,#ffd166cc,#ffd16600 70%);animation:glw .6s ease-out forwards}
@keyframes glw{0%{opacity:1;transform:var(--p) scale(.5)}100%{opacity:0;transform:var(--p) scale(2)}}
.beam{position:absolute;left:0;top:0;height:4px;margin-top:-2px;background:linear-gradient(90deg,#ffd16600,#ffd166,#ffd16600);transform-origin:0 50%;animation:bm .9s ease-out forwards}
@keyframes bm{0%{opacity:1}100%{opacity:0}}
.card-pop{position:absolute;left:0;top:0;width:96px;margin-left:-48px;padding:8px 6px;border-radius:12px;background:#f4f1e8;color:#172133;text-align:center;font-weight:800;font-size:.9rem;box-shadow:0 6px 18px #0008;animation:cpop 1.4s ease-out forwards}
@keyframes cpop{0%{opacity:0;transform:var(--p) translateY(-30px) rotateY(90deg)}20%{opacity:1;transform:var(--p) translateY(-50px) rotateY(0)}80%{opacity:1;transform:var(--p) translateY(-56px)}100%{opacity:0;transform:var(--p) translateY(-70px)}}
#flyLayer{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:40}
.coin{position:absolute;left:0;top:0;width:18px;height:18px;margin:-9px 0 0 -9px}
#fw{position:absolute;inset:0;pointer-events:none}
/* stockbar */
#stockbar{flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;min-height:56px;padding-top:6px}
#stocks{display:flex;gap:6px;flex:1 1 200px;min-width:0}
.sk{display:flex;align-items:center;gap:3px;padding:6px 4px;background:#172133;border-radius:12px;font-weight:800;font-size:min(1.1rem,20px);font-variant-numeric:tabular-nums;flex:1 1 0;min-width:0;max-width:72px;justify-content:center}
.sk svg{flex:none}
.sk.zero{color:#6c7a90}
.sk.flash,#stocks.flash .sk{animation:skf .25s steps(2) 4}
@keyframes skf{50%{background:#5a2330}}
#btnMob{position:relative;flex:1 0 auto;max-width:100%;min-height:52px;padding:4px 12px;border-radius:14px;background:#33415c;color:#e8edf5;font-weight:900;font-size:min(1rem,18px);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;white-space:nowrap}
#btnMob small{font-size:min(.75rem,13px);color:#ffd166}
#btnMob.mob-ready{background:#d9822b;animation:mobg .8s ease-in-out infinite}
@keyframes mobg{50%{transform:scale(1.06)}}
#btnMob:disabled{opacity:.4}
/* drawer */
#dim{position:absolute;inset:0;background:#0009;z-index:5}
#lyAura{z-index:6}
#tgt{position:absolute;left:0;top:0;border:3px solid #ffd166;border-radius:12px;z-index:6;pointer-events:none;box-shadow:0 0 14px #ffd16699}
#drawer.top{bottom:auto;top:0;border-radius:0 0 18px 18px;animation:none}
#drawer.placing{padding-top:8px;gap:0;background:#1b2639f2}
.pbadge{position:absolute;left:0;top:0;border-radius:10px;border:2px dashed #93a1b8;background:#0f1724b3;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:12px;font-weight:900;color:#e8edf5;line-height:1.1;font-variant-numeric:tabular-nums}
.pbadge span{display:flex;align-items:center;gap:2px}
.pbadge.best{border:3px solid #ffd166;color:#ffd166}
.pbadge.guided{background:#0f172466}
.pbadge.guided.best{border-color:#5fd17a;background:#1f6b3f99;color:#ffffff}
.pbig{font-size:20px}
#drawer{position:absolute;left:0;right:0;bottom:0;z-index:20;max-height:55%;background:#1b2639;border-radius:18px 18px 0 0;box-shadow:0 -8px 24px #0009;padding:12px max(24px,env(safe-area-inset-left)) calc(env(safe-area-inset-bottom) + 14px);display:flex;flex-direction:column;gap:10px;overflow:auto;animation:dup .2s ease-out}
@keyframes dup{from{transform:translateY(40px);opacity:0}}
.dhead{display:flex;align-items:center;gap:8px;font-weight:800;font-size:min(1.05rem,19px);min-width:0}
.dtt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;display:flex;align-items:center;gap:4px}
.dtt svg{flex:none}
.dhead .sp{flex:1 0 0}
.dbtn{flex:none;min-height:48px;min-width:72px;padding:0 14px;border-radius:12px;background:#2c3a52;font-weight:800;white-space:nowrap}
#dCards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.card{position:relative;min-height:120px;min-width:0;border-radius:14px;background:#f4f1e8;color:#172133;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px 4px;font-weight:800;text-align:center}
.card .nm{font-size:min(1rem,17px);line-height:1.2}
.card .cost{font-size:min(1.05rem,18px);font-variant-numeric:tabular-nums}
.card .pv{font-size:min(.78rem,13px);color:#3a4a63;line-height:1.2}
.card.poor{background:#9aa3b0}
.card.poor .cost{color:#a3171b}
.card.sug{box-shadow:0 0 0 4px #ffd166,0 0 18px #ffd166aa}
.card .badge{position:absolute;top:-8px;left:50%;transform:translateX(-50%);background:#ffd166;color:#172133;border-radius:8px;padding:1px 8px;font-size:min(.75rem,13px);white-space:nowrap}
.card.press{animation:press .12s ease-out}
#recolor{position:absolute;left:0;right:0;bottom:0;z-index:20;background:#1b2639;border-radius:18px 18px 0 0;padding:12px max(24px,env(safe-area-inset-left)) calc(env(safe-area-inset-bottom) + 14px);display:flex;flex-direction:column;gap:10px;box-shadow:0 -8px 24px #0009}
#rcBtns{display:flex;gap:10px;justify-content:center}
.rcb{width:72px;min-height:72px;border-radius:14px;background:#f4f1e8;color:#172133;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800}
.rcb.poor{background:#9aa3b0}
.rnote{font-size:.85rem;color:#93a1b8}
/* finger */
#finger{position:absolute;left:0;top:0;width:44px;height:52px;z-index:30;pointer-events:none;transition:transform .25s ease-out}
#finger svg{animation:fb .8s ease-in-out infinite}
@keyframes fb{50%{transform:translateY(8px)}}
#toast{position:absolute;left:50%;top:64px;transform:translateX(-50%);z-index:35;pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:6px;max-width:calc(100% - 32px)}
.tst{background:#172133ee;border:2px solid #ffd166;color:#fff;font-weight:900;font-size:min(1.2rem,21px);border-radius:14px;padding:8px 16px;white-space:nowrap;animation:tst 1.8s ease-out forwards}
.tst.sm{font-size:min(.95rem,16px);padding:4px 12px;background:#172133cc}
@keyframes tst{0%{opacity:0;transform:scale(.7)}12%{opacity:1;transform:scale(1.05)}20%{transform:scale(1)}80%{opacity:1}100%{opacity:0}}
/* overlays */
.ov{position:absolute;inset:0;z-index:50;background:#0f1724;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px max(16px,env(safe-area-inset-right)) calc(env(safe-area-inset-bottom) + 24px) max(16px,env(safe-area-inset-left));overflow:auto}
#title,#pause{justify-content:flex-start}
#title>:first-child,#pause>:first-child{margin-top:auto!important}
#title>:last-child,#pause>:last-child{margin-bottom:auto!important}
.ov>*{flex-shrink:0}
#title h1{font-size:2.2rem;margin:0 0 6px;letter-spacing:.06em;text-align:center}
#title .how{color:#c7d1e0;text-align:center;max-width:340px;line-height:1.5;margin:0 0 22px;font-size:1.05rem}
#title .legend{display:flex;gap:14px;margin:0 0 22px;flex-wrap:wrap;justify-content:center;font-size:.95rem;color:#c7d1e0}
#title .legend span{display:flex;align-items:center;gap:4px}
.bigbtn{width:min(320px,100%);min-height:68px;height:auto;padding:8px 12px;border-radius:18px;font-size:1.4rem;font-weight:900;margin:6px 0;background:#2c3a52;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center}
.bigbtn small{font-size:.8rem;font-weight:600;color:#c7d1e0}
.bigbtn.def{background:#d9822b;box-shadow:0 4px 0 #8a4d12}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
.pill{min-height:48px;padding:0 16px;border-radius:24px;background:#172133;font-weight:800;display:flex;align-items:center;gap:6px}
#title .best{color:#93a1b8;margin-top:10px;font-size:.95rem}
#title .home{color:#e8edf5;margin-top:14px;padding:8px 16px;font-size:.95rem;text-decoration:none;background:#0f1724d9;border:1px solid #ffffff2e;border-radius:999px}
#pause{background:#0f1724e6}
#pause .bigbtn{background:#d9822b}
#results{justify-content:flex-start;padding-top:0;padding-left:0;padding-right:0}
#night{position:absolute;inset:0;width:100%;height:100%}
.res{position:relative;width:min(460px,100%);padding:16px max(16px,env(safe-area-inset-left)) 24px;display:flex;flex-direction:column;gap:12px;margin-top:min(38vh,220px);transition:opacity .4s}
.cta{display:flex;gap:10px}
.cta .bigbtn{margin:0}
.res.hide{opacity:0}
.rcard{background:#172133ee;border-radius:16px;padding:14px}
.res h2{margin:0;font-size:1.5rem;text-align:center}
.res .score{font-size:2.6rem;font-weight:900;text-align:center;color:#ffd166;font-variant-numeric:tabular-nums}
.res .lamps{display:flex;justify-content:center;gap:10px}
.res .gap{text-align:center;color:#c7d1e0}
.wall{display:flex;flex-wrap:wrap;gap:8px}
.wc{background:#f4f1e8;color:#172133;border-radius:10px;padding:6px 8px;display:flex;align-items:center;gap:6px;font-weight:800;font-size:.9rem}
.wc.none{background:#3a4660;color:#c7d1e0}

/* ===== 3D 畫面（#app.r3）：棋盤由 three.js 畫，DOM 格子變成透明點擊層；介面換成木框＋羊皮紙 ===== */

const Sfx = {

/* =====================================================================

let G = null, speed = 1, lastTele = null;

function newGame(mode, seedStr) {

    score: 0, combo: 0, lastCatchT: -99, maxCombo: 0,
    cells: [], bubbles: [], units: [], queue: [], delayed: [], groups: {}, exits: [],
    repair: null, repairQ: [], drawer: null, recolor: null,

    stage: 0, blueprint: { active: false, done: false, tapped: false }, breather: false,

    fwStart: -1,

    stats: { catches: 0, misses: 0, ontime: 0, catchPts: 0, bonusBig: 0, bonusBoss: 0, bonusStage: 0, bonusBlueprint: 0, icons: 0, built: {}, dispatched: {} },

}

function buildMap() {
  const r = G.rngMap;
  for (let rr = 0; rr < 7; rr++) for (let c = 0; c < 5; c++) {
    G.cells.push({ i: idx(c, rr), c, r: rr, state: 'broken', house: false, houseV: 0, bld: null, hall: null, reveal: null, tut: false, repairing: false, lockUntil: 0, noPotUntil: 0, dirty: true });
  }
  const hall = G.cells[idx(2, 3)];
  for (let rr = 2; rr <= 4; rr++) for (let c = 1; c <= 3; c++) {
    const cell = G.cells[idx(c, rr)]; cell.state = 'dev'; cell.house = true; cell.houseV = (c + rr) % 3;
  }
  hall.state = 'hall'; hall.house = false; hall.hall = { eng: 1, rescue: 0, care: 0, transit: 0 };
  G.cells[idx(1, 2)].house = false; G.cells[idx(3, 4)].house = false; // 2 塊空地
  G.cells[idx(4, 1)].state = 'site';
  const tut = G.cells[idx(2, 1)]; tut.tut = true;
  for (const cell of G.cells) {
    if (cell.state !== 'broken') continue;
    if (cell.tut) { cell.reveal = 'chest'; continue; }
    const x = r(); const P = RULES.revealP;
    cell.reveal = x < P.coin ? 'coin' : x < P.coin + P.chest ? 'chest' : x < P.coin + P.chest + P.freest ? 'freest' : 'surprise';
  }
  const h = G.cells[idx(2, 3)];
  for (const cell of G.cells) cell.d = man(cell, h) * 0.07;
}

function addItem(evId, at, extra) {
  const ev = EV[evId];
  const it = Object.assign({ id: G.nextId++, ev: evId, at, lead: ev.lead || RULES.forecastLead, cellRule: ev.cellRule || 'random', cells: null, chip: ev.chip !== false, demand: ev.demand ? ev.demand.map(d => d.slice()) : null, name: ev.name }, extra || {});
  if (evId === 'fx_double' && G.rngDeck() < 0.5) { it.demand = ev.alt.demand.map(d => d.slice()); it.name = ev.alt.name; }
  G.queue.push(it);
  return it;
}
function scheduleFixed() {
  for (const ev of EVENTS) if (ev.at != null) addItem(ev.id, ev.at);
}

/* ---------- 格子查詢 ---------- */
const isDev = c => c.state === 'dev' || c.state === 'hall';
const isPlot = c => c.state === 'dev' && !c.house && !c.bld;
const isStation = c => c.bld && c.bld.type === 'station';
const devCount = () => G.cells.filter(isDev).length;
function nb4(cell) { const o = []; for (const [dc, dr] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) { const c = cell.c + dc, r = cell.r + dr; if (c >= 0 && c < 5 && r >= 0 && r < 7) o.push(G.cells[idx(c, r)]); } return o; }
function isQueued(cell) { return (G.repair && G.repair.cell === cell.i) || G.repairQ.some(j => j.cell === cell.i); }
function repairable(cell) { return cell.state === 'broken' && !cell.repairing && nb4(cell).some(isDev); }
function repairCost(cell) { return cell.tut ? 0 : RULES.repairBase + RULES.repairStep * G.repairsN; }
function stations(color) { return G.cells.filter(c => isStation(c) && (!color || c.bld.color === color)); }
function boosters(color) { return G.cells.filter(c => c.bld && c.bld.type === 'booster' && c.bld.buildLeft <= 0 && (!color || c.bld.color === color)); }
function auraMul(cell) { const n = boosters(cell.bld.color).filter(b => cheb(b, cell) <= 1).length; return n >= 2 ? RULES.boosterMul2 : n === 1 ? RULES.boosterMul1 : 1; }
function stockOf(color) { let n = 0; for (const c of G.cells) { if (isStation(c) && c.bld.color === color) n += c.bld.stock; if (c.hall) n += c.hall[color]; } return n; }
function stockTotals() { const o = {}; for (const k of COLORS) o[k] = stockOf(k); return o; }
function builtStations(color) { return stations(color).filter(c => c.bld.buildLeft <= 0); }
function capTotal() { return builtStations().length * RULES.stationCap; }
function prodStock() { return builtStations().reduce((a, c) => a + c.bld.stock, 0); }
function unlockedColors() { return COLORS.filter(k => G.unlocked[k]); }
function phaseKey(t) { return t < 30 ? 'p0' : t < 60 ? 'p1' : t < 90 ? 'p2' : t < 140 ? 'p3' : 'boss'; }
function deckKey(t) { return t < 60 ? 'A' : t < 90 ? 'B' : 'C'; }
function cdKey(t) { return t < 30 ? 'tut' : t < 60 ? 'p1' : t < 90 ? 'p2' : 'p3'; }
function comboWin() { if (G.t < G.eff.comboWinUntil) return RULES.sportsWin; return G.t < RULES.times.tutEnd ? RULES.comboWinTut : RULES.comboWin; }
function ontimeWin() { return RULES.ontimeWin * (G.relax ? RULES.relax.ontimeMul : 1); }
function maxBubbles() { return G.relax ? RULES.maxBubblesRelax : RULES.maxBubbles; }
function activeDemand() { return G.bubbles.filter(b => !b.positive); }
function itemBubbles(it) { return it.demand ? it.demand.length : 1; }

/* 預告中最缺的顏色（預告＋場上未派的需求 − 庫存） */
function demandColors() {
  const need = { eng: 0, rescue: 0, care: 0, transit: 0 };
  for (const it of forecastItems()) if (it.demand) for (const d of it.demand) for (const k of d) need[k]++;
  for (const b of G.bubbles) if (!b.positive) b.needs.forEach((k, i) => { if (!b.assigned[i]) need[k]++; });
  return need;
}
function forecastColors() { const n = demandColors(); return COLORS.filter(k => n[k] > 0 && G.unlocked[k]); }
/* 建議色：預告最缺 → 已解鎖但沒有站（場上需求多者優先）→ 供給最少（站×2＋庫存−需求） */
function suggestColor() {
  const un = unlockedColors(); if (!un.length) return null;
  const s = stockTotals(), dem = demandColors();
  return mostLacking()
    || un.filter(k => !stations(k).length).sort((a, b) => dem[b] - dem[a])[0]
    || un.slice().sort((a, b) => (stations(a).length * 2 + s[a] - dem[a]) - (stations(b).length * 2 + s[b] - dem[b]))[0];
}
function mostLacking() {
  const n = demandColors(), s = stockTotals(); let best = null, bv = 0;
  for (const k of unlockedColors()) { const v = n[k] - s[k]; if (v > bv) { bv = v; best = k; } }
  return best;
}

/* ---------- 地點規則 ---------- */
function reservedCells() { const s = new Set(); for (const b of G.bubbles) s.add(b.cell); for (const it of G.queue) if (it.cells) it.cells.forEach(i => s.add(i)); return s; }
function freeDevCells(evId) {
  const res = reservedCells();
  return G.cells.filter(c => isDev(c) && !res.has(c.i) && !(evId === 'ev_pothole' && G.t < c.noPotUntil));
}
function resolveCells(it) {
  const rule = it.cellRule, rng = G.rngDeck;
  let free = freeDevCells(it.ev);
  if (!free.length) return null;
  if (rule.startsWith('near:')) {
    const [, what, dd] = rule.split(':'); const d = +dd;
    let src = what === 'rescue' ? stations('rescue')[0] : null;
    it.noSrc = what === 'rescue' && !src;
    if (!src) src = G.cells.find(c => c.hall);
    // 優先住宅格（不蓋在站上、不佔空地），距離至少 d；沒有才退而求其次
    const far = c => c !== src && man(c, src) >= d;
    let cand = free.filter(c => c.house && far(c));
    if (!cand.length) cand = free.filter(c => !c.bld && !isPlot(c) && far(c));
    if (!cand.length) cand = free.filter(c => c !== src);
    if (!cand.length) return null;
    cand.sort((a, b) => Math.abs(man(a, src) - d) - Math.abs(man(b, src) - d) || a.i - b.i);
    return [cand[0].i];
  }
  if (rule.startsWith('k:')) {
    const k = +rule.split(':')[1]; const out = [];
    shuffle(rng, free);
    for (const c of free) { if (out.length >= k) break; if (out.every(o => man(G.cells[o], c) >= 2)) out.push(c.i); }
    for (const c of free) { if (out.length >= k) break; if (!out.includes(c.i)) out.push(c.i); }
    return out.length ? out : null;
  }
  return [free[Math.floor(rng() * free.length)].i];
}

/* ---------- 牌堆 ---------- */
function pickRandomEvent(at) {
  const dk = deckKey(at);
  const cands = EVENTS.filter(e => e.family === 'small' && e.w && e.w[dk] && (e.from || 0) <= at);
  return pickW(G.rngDeck, cands, e => e.w[dk]);
}
function intervalAt(at) {
  const f = Math.max(RULES.fMin, 1 - RULES.fK * (devCount() - RULES.fBase));
  const base = RULES.baseInterval[cdKey(at)];
  return base * f * (1 - RULES.jitter + G.rngDeck() * 2 * RULES.jitter);
}
function fillRandom() {
  const T = RULES.times;
  while (G.nextRandAt <= G.t + RULES.forecastLead) {
    const at = G.nextRandAt;
    if (at >= T.breather) break;
    const ev = pickRandomEvent(at);
    addItem(ev.id, at, { rand: true });
    G.nextRandAt = at + intervalAt(at);
  }
}
function forecastItems() {
  if (!G) return [];
  // 大事件／Boss 一進預告窗就一定佔一格，其餘依時間補滿 2 格
  const pri = it => (EV[it.ev].family === 'big' || EV[it.ev].family === 'boss') ? 0 : 1;
  return G.queue.filter(it => it.chip && it.cells && it.at >= G.t - 0.01 && it.at - G.t <= it.lead)
    .sort((a, b) => pri(a) - pri(b) || a.at - b.at).slice(0, 2).sort((a, b) => a.at - b.at);
}

/* =====================================================================
   主邏輯步進
   ===================================================================== */
function step(dt) {
  if (!G || !G.running) return;
  const T = RULES.times;
  G.t += dt;
  const t = G.t;
  // 收入
  G.money += (RULES.baseIncome + RULES.incomePerRepair * G.repairs + RULES.incomePerBuilding * (builtStations().length + boosters().length)) * dt;
  // 修補
  if (G.repair) {
    G.repair.left -= dt;
    if (G.repair.left <= 0) { finishRepair(G.repair.cell); G.repair = G.repairQ.shift() || null; }
  }
  // 建造／生產
  for (const c of G.cells) {
    const b = c.bld; if (!b) continue;
    if (b.buildLeft > 0) {
      b.buildLeft -= dt;
      if (b.buildLeft <= 0) { b.buildLeft = 0; c.dirty = true; if (b.type === 'station') { b.stock = Math.min(RULES.stationCap, b.stock + 1); } fxBuilt(c); if (b.type === 'booster') markAll(); }
      continue;
    }
    if (b.type !== 'station') continue;
    if (b.halt > 0) { b.halt -= dt; if (b.halt <= 0) { b.halt = 0; c.dirty = true; } continue; }
    const iv = RULES.produceSec * auraMul(c);
    const pk = phaseKey(t); const P = telePhase(pk); P.capacity += dt / iv;
    if (b.stock < RULES.stationCap) {
      b.timer += dt;
      if (b.timer >= iv) { b.timer = 0; b.stock++; c.dirty = true; }
    } else b.timer = 0;
  }
  // 解析預告地點、生成到期事件
  for (const it of G.queue) {
    // 教學火警：預告時還沒有救援站，等站蓋好就以實際的站重算地點
    if (it.cells && it.noSrc && stations('rescue').length) { it.cells = null; it.cells = resolveCells(it) || []; continue; }
    if (it.cells || it.at - t > it.lead) continue;
    if (it.ev === 'ev_blueprint' || it.ev === 'ev_boss') { it.cells = []; continue; }
    it.cells = resolveCells(it) || [];
  }
  const due = G.queue.filter(it => it.at <= t).sort((a, b) => a.at - b.at);
  for (const it of due) { G.queue.splice(G.queue.indexOf(it), 1); spawnItem(it); }
  if (G.delayed.length && !G.breather && activeDemand().length + itemBubbles(G.delayed[0]) <= maxBubbles()) { const it = G.delayed.shift(); spawnItem(it, true); }
  if (t >= T.randomStart) fillRandom();
  // 單位移動（先結算抵達，再扣倒數：同一格抵達與歸零算接住）
  for (const u of G.units.slice()) if (t >= u.t0 + u.dur) arriveUnit(u);
  // 泡泡倒數（派出後照走：距離決定來不來得及，GDD §0／§6）
  for (const b of G.bubbles.slice()) {
    if (!G.bubbles.includes(b)) continue;
    if (b.positive) { b.left -= dt; if (b.left <= 0) claimPositive(b, true); continue; }
    b.left -= dt;
    if (b.left <= 0) missBubble(b);
  }
  // Boss 每波硬上限 10 秒：時間到，這波剩下的泡泡一律算漏接 → 自動進下一波
  if (G.boss.active && G.boss.wave >= 0 && G.boss.gid && t >= G.boss.waveEnd) {
    const gid = G.boss.gid; G.boss.gid = null;
    const list = G.bubbles.filter(b => b.group === gid);
    if (list.length) for (const b of list) { if (G.bubbles.includes(b)) missBubble(b); }
    else if (G.groups[gid]) { const g = G.groups[gid]; delete G.groups[gid]; endWave(g.wave, false); }
  }
  // 時間軸
  if (t >= T.blueprint && !G.blueprint.active && !G.blueprint.done) { G.blueprint.active = true; markCell(G.cells.find(c => c.state === 'site')); if (!G.fast) { Sfx.alarm(); if (bpTxt('start')) toast(bpTxt('start')); } }
  bpWatch(false);
  if (t >= T.breather && !G.breatherDone) startBreather();
  if (G.boss.active && G.boss.wave >= 0) {
    // 保險：照理第 3 波最晚 2:55 結束；超過 2:55 + 1 秒仍未結束就強制收尾（剩下的 Boss 泡泡記為漏接）
    if (t > T.boss + 3 * RULES.bossWaveSec + 1) endBoss();
  }
  if (G.fwStart >= 0 && t >= G.fwStart + T.fireworksSec) { finish(); return; }
  if (t >= T.end) { finish(); return; }
  // 遙測
  if (t - G.lastInput >= 10 && !G.idleFlag) { G.idleFlag = true; G.tele.idle10++; }
  if (t >= 30 && t <= 90 && Math.floor(t / 5) !== Math.floor((t - dt) / 5)) sampleSameColorDist();
}

  let cells = (it.cells || []).filter(i => !G.bubbles.some(b => b.cell === i) && isDev(G.cells[i]));
  const need = ev.family === 'positive' ? 1 : (it.demand ? it.demand.length : 1);
  if (cells.length < need) {
    const free = freeDevCells(it.ev).map(c => c.i).filter(i => !cells.includes(i));
    shuffle(G.rngDeck, free);

  if (!cells.length) return;
  if (ev.family === 'positive') { createPositive(cells[0], ev); log(ev.name + ' 出現', 'good'); return; }

  const capExempt = !!ev.capExempt || !!it.capExempt || ev.family === 'fixed';
  if (!capExempt && activeDemand().length + need > maxBubbles()) {

  if (G.relax) cd *= RULES.relax.countdownMul;

    if (cells[k] == null) return;
    const b = createBubble(cells[k], d, { cd, kind: ev.family === 'big' ? 'big' : 'small', ev: ev.id, name: it.name, group: gid });
    if (gid) G.groups[gid].ids.push(b.id);
  });
  log(it.name, '');
}

  const un = unlockedColors();
  const cards = [];
  const has = id => cards.some(x => x.card.id === id);
  const push = (id, sug) => { if (!has(id)) cards.push({ card: CARD[id], cost: CARD[id].type === 'booster' ? RULES.boosterCost : stationPrice(), sug: !!sug }); };
  for (const k of ['care', 'transit']) if (G.unlocked[k] && !G.guaranteed[k]) { push('st_' + k); G.guaranteed[k] = true; }
  const guided = G.relax || G.firstRun;

/* ---------- 跳轉用的簡易自動玩家（除錯 jump 用） ---------- */
function autopilot() {
  if (G.drawer) {
    const cards = G.drawer.cards; const lack = mostLacking();
    let k = cards.findIndex(x => x.card.type === 'station' && x.card.color === lack && G.money >= x.cost);
    if (k < 0) k = cards.findIndex(x => x.card.type === 'station' && G.money >= x.cost);
    if (k >= 0) pickCard(k); else closeDrawer(false);
    return;
  }
  if (G.recolor) { closeRecolor(); return; }
  for (const b of G.bubbles.slice()) { if (b.positive) { tapBubble(b.id); continue; } if (canServeAny(b)) tapBubble(b.id); }
  if (G.blueprint.active) { const s = G.cells.find(c => c.state === 'site'); cellTap(s.i); }
  if (G.boss.active && !G.boss.mobilized && capTotal() && prodStock() <= capTotal() / 3) mobilize(false);
  const plot = G.cells.find(c => isPlot(c) && G.t >= c.lockUntil);
  if (plot && G.money >= RULES.stationCost && stations().length < 7) { cellTap(plot.i); return; }
  if (!G.repair || !G.repairQ.length) {
    const rc = G.cells.filter(c => repairable(c) && !isQueued(c));
    const tutc = rc.find(c => c.tut);
    const pick = tutc || rc.sort((a, b) => man(a, G.cells[idx(2, 3)]) - man(b, G.cells[idx(2, 3)]))[0];

  }
}

  G.fast = true;
  let acc = 0;
  while (G.t < target && G.running) {
    acc += STEP; if (acc >= 0.25) { acc = 0; autopilot(); }
    step(STEP);
  }
  if (G.drawer) { const dc = G.drawer.cell; closeDrawer(false); G.cells[dc].lockUntil = 0; }
  if (G.recolor) closeRecolor();
  G.fast = false;
  G.exits = []; markAll(); G.lastInput = G.t; G.moneyShown = G.money;
  syncDom(true);

  return true;
}

let lastNow = 0, acc = 0, placeSig = '';

  if (G && G.running && !G.paused && DEMO.active) {
    // 示範：遊戲步進與示範 AI 用同一組固定 1/60 切片（同 demoSim），不受幀率影響，日種子＋輪次可重現
    let tot = realDt * speed; if (now < G.slowUntilReal) tot *= RULES.slowmoScale;
    DEMO.sAcc += tot; let n = 0;
    while (DEMO.sAcc >= DEMO_H && n < 2000 && G.running) { DEMO.sAcc -= DEMO_H; demoSlice(DEMO_H, false); n++; }
  } else if (G && G.running && !G.paused) {
    let ts = speed;
    if (G.drawer || G.recolor) ts *= (G.relax || G.t < RULES.times.tutEnd) ? 0 : RULES.drawerScaleStd;
    if (now < G.slowUntilReal) ts *= RULES.slowmoScale;
    acc += realDt * ts;
    let n = 0;
    while (acc >= STEP && n < 600) { step(STEP); acc -= STEP; n++; if (!G.running) break; }
  }
  if (DEMO.active) demoFrame(realDt);
  if (G && !G.over) {
    syncDom(false);
    if (DEMO.active) demoUI();
    if (G.drawer && !$('#drawer').hidden) {
      if (G.drawer.placing != null) { const sig = G.cells.filter(isPlot).map(c => c.i).join() + '|' + boosters().length + '|' + stations().map(c => c.i + c.bld.color).join(); if (sig !== placeSig) { placeSig = sig; renderPlacement(); } }

  if (REND === '3d' && R3) {

}

/* =====================================================================
   3D 畫面（three.js r160）：只換棋盤的皮。地形、建築、單位、特效畫在 canvas，
   格子／泡泡／飄字仍是 DOM，位置由正交相機的投影（仿射）算出。
   ===================================================================== */
const S0 = 64, TILE_TOP = 0.09, BUB_LIFT = 0.62, FX_LIFT = 0.5, DEG = Math.PI / 180;
const CAM = { yaw: 30, pitch: 56, zoom: 1, auto: 1, hit: 0.12 };
const HASHP = location.hash.slice(1).split(/[,&]/);
/* 建築畫風：'hsinchu'＝新竹地標（預設）／'aoe'＝世紀帝國（網址 #aoe）。只影響 makeR3 選哪一組 builder */
let ART = HASHP.includes('aoe') ? 'aoe' : 'hsinchu';
let REND = '2d', R3 = null, AF = null, titleS = null, threeP = null, rendBusy = null, R3dead = false, pendingRend = null, threeTry = 0;
const lyUp = $('#lyUp'), upEls = [], bpDone = { g: null, t: 0, hid: false };
let upSig = '';
/* 格子中心座標（cf, rf）＋高度 h → #board 內 px（只在 3D 用） */
function gx(cf, rf) { return AF.ox + AF.ax * cf + AF.bx * rf; }
function gy(cf, rf, h) { return AF.oy + AF.ay * cf + AF.by * rf - AF.hy * h; }
/* 把 S0×S0 的 DOM 方塊映到地面上 (c0,r0) 起 w×h 格的平行四邊形（ins＝內縮格數） */
function gMat(c0, r0, w, h, ins) {
  ins = ins || 0;
  const cf = c0 - 0.5 + ins, rf = r0 - 0.5 + ins, W = w - 2 * ins, H = h - 2 * ins;
  return `matrix(${(AF.ax * W / S0).toFixed(5)},${(AF.ay * W / S0).toFixed(5)},${(AF.bx * H / S0).toFixed(5)},${(AF.by * H / S0).toFixed(5)},${gx(cf, rf).toFixed(2)},${gy(cf, rf, CAM.hit).toFixed(2)})`;
}
/* 泡泡浮起的高度：手機（斜角已收掉、格子較擠）壓低，泡泡底不跨進上一格；
   桌機浮到屋頂上方，但第一列不超過預設（避免超出棋盤上緣） */
function bubLift(cell) {
  if (!AF || AF.narrow) return 0.36;
  if (cell.r === 0 || !R3) return BUB_LIFT;
  return clamp(R3.topOf(cell) + 0.1, BUB_LIFT, 0.95);
}
/* 高建築的屋頂在螢幕上會伸進後一排的格子：替這種格子多加一塊透明點擊區（從屋頂往下到格子後段），
   前排排在後面（DOM 順序＝前排在上），所以畫面上誰擋住誰，點到的就是誰 */
const UP_MIN = 0.55;
function upGeom(cell, top) {
  const c0 = cell.c - 0.3, r0 = cell.r - 0.25, hpx = (top - CAM.hit) * AF.hy;
  return { ox: gx(c0, r0), oy: gy(c0, r0, top), ax: AF.ax * 0.6, ay: AF.ay * 0.6, h: hpx };
}
function upNeeded(top) { return top > UP_MIN && (top - CAM.hit) * AF.hy > 0.25 * AF.by + 2; }
function syncUp() {
  if (!AF || !R3) { if (upEls.length && upSig !== 'off') { for (const el of upEls) el.hidden = true; upSig = 'off'; } return; }
  if (!upEls.length) for (let i = 0; i < 35; i++) { const el = document.createElement('div'); el.className = 'uphit'; el.dataset.i = i; el.hidden = true; lyUp.appendChild(el); upEls.push(el); }
  let sig = '';
  const tops = G.cells.map(c => { const t = R3.topOf(c); sig += t.toFixed(2) + ','; return t; });
  if (sig === upSig) return;
  upSig = sig;
  for (const cell of G.cells) {
    const el = upEls[cell.i], t = tops[cell.i];
    if (!upNeeded(t)) { el.hidden = true; continue; }
    const g = upGeom(cell, t);
    el.style.transform = `matrix(${(g.ax / S0).toFixed(5)},${(g.ay / S0).toFixed(5)},0,${(g.h / S0).toFixed(5)},${g.ox.toFixed(2)},${g.oy.toFixed(2)})`;
    el.hidden = false;
  }
}
/* 手機橫放：棋盤只剩郵票大，蓋一層「請轉直」並暫停；轉回直的後留在暫停畫面，按「繼續值班」再開始 */
let rotPaused = false;
function checkRotate() {
  const el = $('#rotate'); if (!el) return;
  const show = !FINE && innerWidth > innerHeight && innerHeight < 500 && midGame();
  if (show && el.hidden) { el.hidden = false; if (!G.paused) { G.paused = true; rotPaused = true; } }
  else if (!show && !el.hidden) { el.hidden = true; if (rotPaused && midGame()) $('#pause').hidden = false; rotPaused = false; }
}
/* 螢幕座標 → 格子 index（2D 用格寬；3D 用仿射反算），不在棋盤上回 -1 */
function cellAt(clientX, clientY) {
  const r = board.getBoundingClientRect(), x = clientX - r.left, y = clientY - r.top;
  let c, rr;
  if (AF && R3 && G) {
    // 3D：先看高建築的屋頂點擊區（前排優先），再看地面
    for (let i = 34; i >= 0; i--) {
      const cell = G.cells[i], t = R3.topOf(cell); if (!upNeeded(t)) continue;
      const g = upGeom(cell, t), s1 = (x - g.ox) / g.ax, t1 = (y - g.oy - s1 * g.ay) / g.h;
      if (s1 >= 0 && s1 <= 1 && t1 >= 0 && t1 <= 1) return i;
    }
  }

/* 抽屜裡每張卡的分數（<0＝不要）：已經打開了，就挑現有卡裡最有用的，不要空手取消 */
function dmCardScore(it) {

  if (c.free) return 100;
  const I = DEMO.intent, late = dmLate();
  if (c.type === 'booster') {
    const o = placeOptions(c.color)[0]; if (!o || o.n < 1) return -1;
    let s = o.n >= 2 ? 20 + o.n : (late || (!dmBoosters() && G.t >= 112)) ? 12 : DMK.bo1;

  }
  if (late || stations().length >= DMK.maxSt) return -1;   // 喘口氣起不再加站（站越多，煙火節的波越大）
  const k = c.color, cnt = stations(k).length;

  const C = D.cur, a = D.pending;
  C.sc = CS < 48;   // 小格子時游標縮小，少蓋住泡泡
  const glide = (p, t0) => { const f = clamp((D.clock - t0) / DEMO_MOVE, 0, 1), e = 1 - Math.pow(1 - f, 3); C.x = C.sx + (p.x - C.sx) * e; C.y = C.sy + (p.y - C.sy) * e; };
  if (a) { const p = demoTargetPt(a); if (p) glide(p, C.t0); }
  else if (D.parkAt && D.clock >= D.parkAt) {
    if (!C.parking) { C.parking = true; C.sx = C.x; C.sy = C.y; }
    glide(demoParkPt(), D.parkAt);
    if (D.clock >= D.parkAt + DEMO_MOVE) { D.parkAt = 0; C.parking = false; }
  }
  demoCurPos();
  // 抽屜／換班選單開著：字幕移到頂端示範列正下方（蓋在 HUD 上），不擋棋盤、目標格與庫存列
  const cap = $('#demoCap'), dr = $('#drawer'), rc = $('#recolor'), bar = $('#demoBar');
  const open = (!dr.hidden && !dr.classList.contains('top')) || !rc.hidden;
  const dy = open ? Math.min(0, bar.offsetTop + bar.offsetHeight + 2 - cap.offsetTop) : 0;
  if (cap._dy !== dy) { cap._dy = dy; cap.style.transform = dy ? `translateY(${dy}px)` : ''; cap.classList.toggle('up', !!dy); }
}
/* 結算停 10 秒「再看一局？」再自動開下一局；遊戲中照節奏出手 */
function demoFrame(realDt) {
  const D = DEMO; if (!D.active || !G) return;
  if (G.over) {
    if (!D.resShown) { D.resShown = true; D.resLeft = DEMO_RES; D.pending = null; demoShowCap('再看一局？'); $('#dcur').hidden = true; $('#demoNext').hidden = false; }
    if (!document.hidden) D.resLeft -= realDt;   // 結算停留用真實時間（×2 也照樣停 10 秒）
    const n = String(Math.max(0, Math.ceil(D.resLeft))), b = $('#demoNextN'); if (b.textContent !== n) b.textContent = n;
    if (D.resLeft <= 0) demoNewRound();
    return;
  }
  if (G.running && !G.paused) D.capReal += realDt;   // 字幕用真實時間（×2 時每句照樣至少 1.6 秒）
}
/* 一個固定切片：遊戲走 h×（抽屜 0.3 倍速／教學凍結），示範 AI 走 h；畫面與 demoSim 共用 */
function demoSlice(h, sim) {
  const ts = (G.drawer || G.recolor) ? (G.t < RULES.times.tutEnd ? 0 : RULES.drawerScaleStd) : 1;
  acc += h * ts;
  while (acc >= STEP) {
    if (sim && ((G.fwStart >= 0 && G.t + STEP >= G.fwStart + RULES.times.fireworksSec) || G.t + STEP >= RULES.times.end)) return false;
    step(STEP); acc -= STEP;
    if (!G.running) return false;
  }
  demoTick(h);
  return true;
}

/* ---------- 開始／換我玩／結束 ---------- */
function demoShowUI(on) {
  $('#demoBar').hidden = !on; $('#demoCap').hidden = !on; $('#dcur').hidden = !on;
  if (!on) $('#demoNext').hidden = true;
}
function demoMarkSpd() { document.querySelectorAll('#dSpd button').forEach(b => b.classList.toggle('on', +b.dataset.s === speed)); markSpd(); }
function demoInitGame() {
  const D = DEMO;
  G.demo = true; G.firstRun = false; G.tele.firstRun = false; G.tele.demo = true; G.tele.demoRound = D.round;
  D.clock = 0; D.nextAt = 0.9; D.pending = null; D.lookUntil = 0; D.intent = null; D.actions = []; D.nAct = 0; D.nDisp = 0; D.nPartial = 0; D.nRecol = 0; D.lastRecol = null;
  D.cap = ''; D.capAt = -99; D.capPrio = 0; D.capReal = 0; D.capPend = null; D.capLog = []; D.keyAt = {}; D.mute = 0; D.resShown = false; D.sAcc = 0; D.parkAt = 0;
  D.seen = { lastLog: null, combo: 0, comboLv: {}, big: 0, waves: 0, stage: 0, rainFc: false, bossFc: false, done: false };
  D.rng = mulberry32(hashStr(G.seedStr + '|demo-ai'));
  if (!G.fast) {
    speed = D.spd; demoMarkSpd();
    const ar = $('#app').getBoundingClientRect(), br = $('#boardWrap').getBoundingClientRect();
    D.cur.x = br.left - ar.left + br.width / 2; D.cur.y = br.top - ar.top + br.height * 0.8; D.cur.set = '';
  }
  demoSay('AI 示範開始！先修好發亮的教學格', 3);
}
function demoNewRound() {
  const D = DEMO; D.round++;
  const seed = D.seed0 ? (D.round === 1 ? D.seed0 : D.seed0 + '#' + D.round) : todayStr() + '-demo' + D.round;
  $('#demoNext').hidden = true; demoShowUI(true);
  startGame('std', seed);
  demoInitGame();
}
function startDemo(opt) {
  opt = opt || {};
  const D = DEMO; D.active = true; D.loop = true; D.round = 0; D.seed0 = opt.seed || null;
  D.spd = opt.speed ? clamp(+opt.speed, 0.25, 16) : 1;
  demoNewRound();
  return true;
}
function demoTakeover() {
  if (!DEMO.active || !G || G.over) return false;
  DEMO.active = false; DEMO.pending = null;
  G.demo = false; G.tele.takeover = +G.t.toFixed(1); G.lastInput = G.t;
  speed = 1; demoMarkSpd(); demoShowUI(false);
  toast('換你玩！從這裡接手');
  return true;
}
function demoEnd() {
  DEMO.active = false; DEMO.pending = null;
  speed = 1; demoMarkSpd(); demoShowUI(false);
  if (G) { G.running = false; hideDrawer(); $('#recolor').hidden = true; $('#btnMob').hidden = true; $('#finger').hidden = true; }
  showTitle();
  return true;
}
/* 結算頁「換我玩一局」：結束示範，開一般標準局 */
function demoPlayNow() {
  DEMO.active = false; DEMO.pending = null;
  speed = 1; demoMarkSpd(); demoShowUI(false);
  startGame('std');
  return true;
}
function demoMech() {
  if (!G) return null;
  const T = G.tele, bl = G.stats.built;
  return {
    tutorial: G.tut.freeBuilt && G.cells.some(c => c.tut && c.state === 'dev'),
    repair: G.repairs >= 2,
    stations4: COLORS.every(k => bl['st_' + k] || (k === 'rescue' && bl.st_rescue_free)),
    booster: T.boosterPlacements.length > 0,
    partial: T.partials > 0 || DEMO.nPartial > 0,
    combo: G.maxCombo >= 2,
    rainAll: G.stats.bonusBig > 0,
    blueprint: !!G.blueprint.tapped,
    boss3: T.bossWaves.length >= 3,
    mobilize: !!(T.mobilize && !T.mobilize.auto),
    results: !!G.over,
  };
}
/* 測試／調校用：不開畫面，用同一套示範 AI 快速跑完一局（不寫任何紀錄） */
function demoSim(seed) {
  const pG = G, pD = Object.assign({}, DEMO), pS = speed, pA = acc;
  let out;
  try {
    newGame('std', seed || todayStr() + '-demo1'); G.fast = true; DEMO.round = 1; acc = 0; demoInitGame();
    while (G.running && demoSlice(DEMO_H, true)) if (DEMO.clock > 1500) break;
    const st = G.stats, tot = st.catches + st.misses, th = lampThresholds();
    out = {
      seed: G.seedStr, score: Math.round(G.score), lamps: th.filter(v => G.score >= v).length, catches: st.catches, misses: st.misses,
      missRate: tot ? +(st.misses / tot).toFixed(3) : 0, ontimeRate: st.catches ? +(st.ontime / st.catches).toFixed(3) : 0, maxCombo: G.maxCombo,
      catchPts: st.catchPts, bonusBig: st.bonusBig, bonusBoss: st.bonusBoss, bonusBlueprint: st.bonusBlueprint, waves: G.boss.caughtWaves,
      mech: Object.assign(demoMech(), { results: true }), actions: DEMO.nAct, built: Object.assign({}, st.built), dev: devCount(),
      mobilize: G.tele.mobilize, bossWaves: G.tele.bossWaves, partials: G.tele.partials, boosters: G.tele.boosterPlacements, money: Math.round(G.money),
      phase: JSON.parse(JSON.stringify(G.tele.phase)),
      log: DEMO.actions.map(x => x.t + ' ' + x.kind + ':' + x.r),
      captions: DEMO.capLog.map(x => x.t + ' [' + x.p + '] ' + x.text),
    };
  } finally { G = pG; Object.assign(DEMO, pD); speed = pS; acc = pA; }
  return out;
}
function bindDemo() {
  $('#btnDemo').addEventListener('click', () => { Sfx.init(); startDemo({}); });
  $('#dTake').addEventListener('click', () => demoTakeover());
  $('#dEnd').addEventListener('click', () => demoEnd());
  $('#dSpd').addEventListener('click', e => { const b = e.target.closest('button[data-s]'); if (!b || !DEMO.active) return; speed = DEMO.spd = +b.dataset.s; demoMarkSpd(); });
  // 示範中：棋盤、抽屜、動員鈕都不吃路人的點擊（只有「換我玩」能接手）；音效鈕照常
  const block = e => { if (!DEMO.active) return; if (e.target.closest && e.target.closest('#demoBar,#btnMute,#btnGear')) return; e.stopPropagation(); if (e.type === 'click') e.preventDefault(); };
  for (const ev of ['pointerdown', 'click']) $('#main').addEventListener(ev, block, true);
}
Object.assign(window.__game, {
  demo: (on, spd, seed) => on ? startDemo({ speed: spd, seed }) : (DEMO.active ? demoEnd() : false),
  demoState: () => JSON.parse(JSON.stringify({
    active: DEMO.active, loop: DEMO.loop, lastCaption: DEMO.cap, actions: DEMO.actions, round: DEMO.round, nActions: DEMO.nAct,
    pending: DEMO.pending ? DEMO.pending.kind : null, captions: DEMO.capLog, clock: +DEMO.clock.toFixed(2), capClock: +DEMO.capReal.toFixed(2), speed, mech: demoMech(),
    resLeft: G && G.over && DEMO.active ? +DEMO.resLeft.toFixed(2) : null,
  })),
  demoSim: seed => demoSim(seed),
});

/* ---------- 啟動 ---------- */
buildBoardDom();
bindInput();
bindDemo();
initTitle();
layout();
if (location.hash.indexOf('debug') >= 0) { $('#btnGear').hidden = false; toggleDebug(true); }
requestAnimationFrame(frame);
if (HASHP.includes('demo')) { $('#title').classList.add('demoload'); $('#demoLoad').hidden = false; }   // #demo：載入中先藏起標題按鈕，路人不會以為要自己按
setRenderer(HASHP.includes('2d') ? '2d' : '3d', { auto: true }).then(() => { if (HASHP.includes('demo') && !G) startDemo({}); }).finally(() => { $('#title').classList.remove('demoload'); $('#demoLoad').hidden = true; });   // #demo：開頁直接進示範（沒有手勢，第一次點擊才開聲音）
</script>
</body>
